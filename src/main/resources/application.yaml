spring:
  application:
    name: focus
  docker:
    compose:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/focus}
    username: ${SPRING_DATASOURCE_USERNAME:focus}
    password: ${SPRING_DATASOURCE_PASSWORD:focus}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
